name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Verify Storefront Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify TACE Storefront Static Output
      run: |
        test -f index.html
        echo "Deployed via GitHub Pages (https://choijuho80.github.io/leestudymath/)"
