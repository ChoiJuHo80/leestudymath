<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 트렌드 꿀템 공식 최저가 스토어 | @tace_trend_lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #090d16; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen pb-16">
  <!-- 상단 관리자 로그인 버튼 바 -->
  <div class="bg-slate-950 border-b border-slate-900 px-4 py-2 flex items-center justify-between text-xs max-w-xl mx-auto">
    <span class="text-slate-400 font-semibold">TACE Official Storefront</span>
    <div>
      <button id="btn-open-login" onclick="openLoginModal()" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 font-bold">
        🔐 관리자 로그인
      </button>
      <button id="btn-logout" onclick="adminLogout()" class="hidden px-2.5 py-1 rounded-lg bg-rose-950/80 hover:bg-rose-900 border border-rose-500/40 text-rose-300 font-bold">
        🔓 관리자 로그아웃 (rlfn100)
      </button>
    </div>
  </div>

  <!-- 관리자 로그인 모달 -->
  <div id="login-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl bg-slate-900 border border-blue-500/40 p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-extrabold text-white">🔐 스토어 관리자 로그인</h3>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>
      <form onsubmit="submitLogin(event)" class="space-y-3">
        <input id="adm-id" type="text" required placeholder="관리자 아이디"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
        <input id="adm-pw" type="password" required placeholder="비밀번호"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
        <p id="adm-err" class="hidden text-xs text-rose-400 font-bold"></p>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm">
          로그인
        </button>
      </form>
    </div>
  </div>

  <header class="bg-gradient-to-b from-blue-950/80 to-slate-950 border-b border-slate-800 px-4 py-8 text-center">
    <div class="max-w-xl mx-auto space-y-3">
      <span class="inline-block text-xs font-extrabold px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/40">
        ⚡ 유튜브 숏츠 & 블로그 공식 최저가 구매 브릿지 (@tace_trend_lab)
      </span>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
        영상에서 본 상품 번호(<span class="text-amber-400">#101</span>)를 검색하세요!
      </h1>
      <p class="text-xs sm:text-sm text-slate-300">
        쿠팡 로켓/Wing 입점 공식 스토어 · 도서산간 안심 배송 · 실시간 최저가 비교
      </p>
      <div class="pt-2">
        <input id="search-input" type="text" oninput="renderCards()"
          placeholder="🔎 상품 번호 (예: 101) 또는 상품명 검색..."
          class="w-full px-4 py-3.5 rounded-2xl bg-slate-900 border-2 border-blue-500/60 text-white text-sm focus:outline-none focus:border-amber-400 shadow-lg" />
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-6 space-y-4">
    <!-- 관리자 전용 요약 대시보드 (로그인 시 표시) -->
    <section id="admin-summary-panel" class="hidden rounded-2xl bg-gradient-to-r from-indigo-950/90 to-slate-900 border border-indigo-500/50 p-4 space-y-3 shadow-xl">
      <div class="flex items-center justify-between">
        <span class="text-xs font-extrabold text-indigo-300">👑 관리자 전용 실시간 수익·원가 브리핑 (rlfn100)</span>
        <span class="text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold">쿠팡 Wing 입점완료 · 네이버 심사중</span>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="p-2.5 rounded-xl bg-slate-950/70 border border-slate-800">
          <div class="text-[11px] text-slate-400">누적 실현 매출</div>
          <div class="text-sm font-extrabold text-white">309,320원</div>
        </div>
        <div class="p-2.5 rounded-xl bg-slate-950/70 border border-slate-800">
          <div class="text-[11px] text-slate-400">누적 순수익</div>
          <div class="text-sm font-extrabold text-emerald-400">+38,310원</div>
        </div>
        <div class="p-2.5 rounded-xl bg-slate-950/70 border border-slate-800">
          <div class="text-[11px] text-slate-400">등록 상품수</div>
          <div class="text-sm font-extrabold text-amber-300">8개</div>
        </div>
      </div>
    </section>

    <div id="cards-container" class="space-y-4"></div>
  </main>

  <script>
    const PRODUCTS = [{"id": 8, "code": "#110", "wholesale_id": "DM936383", "title": "TV 방송 셀럽 트렌드 착용 벨벳 헤어 스크런치 머리끈 프리미엄 고급형", "keyword": "TV 방송 셀럽 트렌드 셀럽 착용 벨벳 헤어 스크런치 머리끈", "tags": ["TV", "방송", "셀럽", "트렌드", "착용"], "supply_price": 8000, "shipping_fee": 3000, "lowest_price": 13180, "coupang_price": 14450, "naver_price": 13180, "gmarket_price": 14570, "avg_profit": 1673, "sales_count": 10, "stock_quantity": 120}, {"id": 7, "code": "#102", "wholesale_id": "DM415300", "title": "집들이 센스있는 선물 TV 방송 화제 방송인 셀럽", "keyword": "TV 방송 화제 방송인 셀럽 도자기 미니 가습기", "tags": ["신혼부부선물", "집들이센스있는선물", "TV", "방송", "화제"], "supply_price": 24000, "shipping_fee": 3000, "lowest_price": 33880, "coupang_price": 36530, "naver_price": 33880, "gmarket_price": 37660, "avg_profit": 5455, "sales_count": 0, "stock_quantity": 120}, {"id": 6, "code": "#103", "wholesale_id": "DM316023", "title": "집들이 센스있는 선물 인기 예능 방송 TV 셀럽", "keyword": "인기 예능 방송 TV 방송 셀럽 착용 오버핏 플리스 자켓", "tags": ["신혼부부선물", "집들이센스있는선물", "인기", "예능", "방송"], "supply_price": 15000, "shipping_fee": 3000, "lowest_price": 22240, "coupang_price": 24000, "naver_price": 22240, "gmarket_price": 24910, "avg_profit": 3365, "sales_count": 0, "stock_quantity": 120}, {"id": 5, "code": "#104", "wholesale_id": "DM191615", "title": "집들이 센스있는 선물 캠핑용 접이식 화로대 불멍 미니화로", "keyword": "캠핑용 접이식 화로대 불멍 미니화로", "tags": ["신혼부부선물", "집들이센스있는선물", "캠핑용", "접이식", "화로대"], "supply_price": 15000, "shipping_fee": 3000, "lowest_price": 22190, "coupang_price": 23770, "naver_price": 22190, "gmarket_price": 24720, "avg_profit": 3226, "sales_count": 8, "stock_quantity": 120}, {"id": 4, "code": "#105", "wholesale_id": "DM988246", "title": "집들이 센스있는 선물 차량용 맥세이프 고속 무선충전 거치대", "keyword": "차량용 맥세이프 고속 무선충전 거치대", "tags": ["신혼부부선물", "집들이센스있는선물", "차량용", "맥세이프", "고속"], "supply_price": 26000, "shipping_fee": 3000, "lowest_price": 36420, "coupang_price": 39230, "naver_price": 36420, "gmarket_price": 40470, "avg_profit": 5873, "sales_count": 0, "stock_quantity": 120}, {"id": 3, "code": "#106", "wholesale_id": "DM828809", "title": "집들이 센스있는 선물 극세사 발매트 욕실 미끄럼방지 매트", "keyword": "극세사 발매트 욕실 미끄럼방지 매트", "tags": ["신혼부부선물", "집들이센스있는선물", "극세사", "발매트", "욕실"], "supply_price": 17000, "shipping_fee": 3000, "lowest_price": 25140, "coupang_price": 26840, "naver_price": 25140, "gmarket_price": 27600, "avg_profit": 3903, "sales_count": 0, "stock_quantity": 120}, {"id": 2, "code": "#107", "wholesale_id": "DM990423", "title": "집들이 센스있는 선물 스테인리스 김치통 밀폐용기 세트", "keyword": "스테인리스 김치통 밀폐용기 세트", "tags": ["신혼부부선물", "집들이센스있는선물", "스테인리스", "김치통", "밀폐용기"], "supply_price": 37500, "shipping_fee": 3000, "lowest_price": 51460, "coupang_price": 55030, "naver_price": 51460, "gmarket_price": 56920, "avg_profit": 8579, "sales_count": 0, "stock_quantity": 50}, {"id": 1, "code": "#108", "wholesale_id": "DM719014", "title": "집들이 센스있는 선물 올리브영 온열 안대 수면안대", "keyword": "올리브영 온열 안대 수면안대", "tags": ["신혼부부선물", "집들이센스있는선물", "올리브영", "온열", "안대"], "supply_price": 21000, "shipping_fee": 3000, "lowest_price": 31000, "coupang_price": 33300, "naver_price": 31000, "gmarket_price": 34300, "avg_profit": 5613, "sales_count": 0, "stock_quantity": 0}];
    const ADMIN_HASH = "4fb7a9c60e29216e03c3204a82ab0a2994e865596d82d62b4ea31a1cb5c7bc87";
    let isAdmin = sessionStorage.getItem('tace_bridge_admin') === '1';

    async function sha256Hex(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function openLoginModal() {
      document.getElementById('login-modal').classList.remove('hidden');
    }

    function closeLoginModal() {
      document.getElementById('login-modal').classList.add('hidden');
    }

    async function submitLogin(e) {
      e.preventDefault();
      const id = document.getElementById('adm-id').value.trim();
      const pw = document.getElementById('adm-pw').value;
      const hash = await sha256Hex(`${id}:${pw}`);
      if (hash === ADMIN_HASH) {
        isAdmin = true;
        sessionStorage.setItem('tace_bridge_admin', '1');
        closeLoginModal();
        updateAdminUI();
      } else {
        const err = document.getElementById('adm-err');
        err.textContent = '🚫 아이디 또는 비밀번호가 올바르지 않습니다.';
        err.classList.remove('hidden');
      }
    }

    function adminLogout() {
      isAdmin = false;
      sessionStorage.removeItem('tace_bridge_admin');
      updateAdminUI();
    }

    function updateAdminUI() {
      document.getElementById('admin-summary-panel').classList.toggle('hidden', !isAdmin);
      document.getElementById('btn-open-login').classList.toggle('hidden', isAdmin);
      document.getElementById('btn-logout').classList.toggle('hidden', !isAdmin);
      renderCards();
    }

    function renderCards() {
      const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
      const box = document.getElementById('cards-container');
      const filtered = PRODUCTS.filter(p =>
        !q ||
        p.code.toLowerCase().includes(q) ||
        p.title.toLowerCase().includes(q) ||
        p.keyword.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        box.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">검색 조건에 맞는 상품이 없습니다.</div>`;
        return;
      }

      box.innerHTML = filtered.map(p => `
        <div class="rounded-2xl bg-slate-900/90 border border-slate-800 p-5 space-y-4 shadow-xl">
          <div class="flex items-start justify-between gap-3">
            <div>
              <span class="inline-block text-xs font-extrabold px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 mb-1.5">
                상품번호 ${p.code}
              </span>
              <h2 class="text-base sm:text-lg font-bold text-white leading-snug">${p.title}</h2>
              <div class="flex flex-wrap gap-1.5 mt-2">
                ${(p.tags || []).map(t => `<span class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300">#${t}</span>`).join('')}
              </div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-[11px] text-slate-400">최저 혜택가</div>
              <div class="text-lg font-extrabold text-amber-400">${p.lowest_price.toLocaleString()}원</div>
            </div>
          </div>

          ${isAdmin ? `
          <div class="p-3 rounded-xl bg-indigo-950/50 border border-indigo-500/30 text-xs space-y-1">
            <div class="flex items-center justify-between text-indigo-300 font-bold">
              <span>🔒 [관리자] 도매매 #${p.wholesale_id}</span>
              <span>재고 ${p.stock_quantity}개 · 누적판매 ${p.sales_count}건</span>
            </div>
            <div class="flex items-center justify-between text-slate-300">
              <span>도매원가 ${p.supply_price.toLocaleString()}원 (+배송비 ${p.shipping_fee.toLocaleString()}원)</span>
              <span class="text-emerald-400 font-bold">개당 평균순익 +${p.avg_profit.toLocaleString()}원</span>
            </div>
          </div>
          ` : ''}

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2 border-t border-slate-800/80">
            <a href="https://www.coupang.com/np/search?q=${encodeURIComponent(p.title)}" target="_blank"
              class="flex items-center justify-between px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs sm:text-sm transition shadow">
              <span>🔵 쿠팡 Wing 바로구매</span>
              <span>${p.coupang_price.toLocaleString()}원 ↗</span>
            </a>
            <a href="https://search.shopping.naver.com/search/all?query=${encodeURIComponent(p.title)}" target="_blank"
              class="flex items-center justify-between px-4 py-3 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm transition">
              <span>🟢 네이버 최저가 확인</span>
              <span>${p.naver_price.toLocaleString()}원 ↗</span>
            </a>
          </div>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('code')) {
        document.getElementById('search-input').value = params.get('code');
      }
      updateAdminUI();
    });
  </script>
</body>
</html>
